<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">

  <title>Président du Baou</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f4f4;
      color: #171717;
    }

    .header {
      background: #111;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    .header .crown {
      font-size: 42px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 28px;
      text-transform: uppercase;
    }

    .header p {
      margin: 5px 0 0;
      opacity: 0.75;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    }

    h2 {
      margin-top: 0;
      font-size: 20px;
    }

    select {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #ccc;
      font-size: 17px;
      background: white;
    }

    .counter {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 25px;
      margin: 25px 0;
    }

    .counter button {
      width: 55px;
      height: 55px;
      border-radius: 50%;
      border: none;
      background: #222;
      color: white;
      font-size: 30px;
      cursor: pointer;
    }

    #nombre {
      font-size: 42px;
      font-weight: bold;
      min-width: 55px;
      text-align: center;
    }

    .validate {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 12px;
      background: #d71920;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .validate:hover {
      opacity: .9;
    }

    .ranking {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .ranking li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 5px;
      border-bottom: 1px solid #eee;
      font-size: 17px;
    }

    .ranking li:last-child {
      border-bottom: none;
    }

    .score {
      font-weight: bold;
      font-size: 20px;
    }

    .total {
      background: #111;
      color: white;
      text-align: center;
    }

    .total-number {
      font-size: 44px;
      font-weight: bold;
      margin: 5px;
    }

    .small {
      color: #777;
      font-size: 13px;
      text-align: center;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="crown">👑</div>
    <h1>Le Président du Baou</h1>
    <p>Challenge Team Trail Loisir</p>
  </header>

  <main class="container">

    <section class="card">
      <h2>Qui es-tu ?</h2>

      <select id="participant">
        <option value="1">Jean Jacques</option>
        <option value="2">Gérard</option>
        <option value="3">Baptiste</option>
      </select>
    </section>

    <section class="card">

      <h2>Combien de montées aujourd'hui ?</h2>

      <div class="counter">

        <button onclick="moins()">−</button>

        <div id="nombre">1</div>

        <button onclick="plus()">+</button>

      </div>

      <button class="validate" onclick="valider()">
        VALIDER MES MONTÉES
      </button>

    </section>

    <section class="card">

      <h2>🏆 Classement</h2>

      <ul class="ranking">

        <li>
          <span>🥇 Jean Jacques</span>
          <span class="score">4</span>
        </li>

        <li>
          <span>🥈 Baptiste</span>
          <span class="score">3</span>
        </li>

        <li>
          <span>🥉 Gérard</span>
          <span class="score">2</span>
        </li>

      </ul>

    </section>

    <section class="card total">

      <div>Total des montées du club</div>

      <div class="total-number">9</div>

      <div>🔥 Ça commence à chauffer dans le Baou !</div>

    </section>

    <div class="small">
      Président du Baou • Team Trail Loisir
    </div>

  </main>

  <script>

    let nombre = 1;

    function afficher() {
      document.getElementById("nombre").textContent = nombre;
    }

    function plus() {
      nombre++;
      afficher();
    }

    function moins() {
      if (nombre > 1) {
        nombre--;
        afficher();
      }
    }

    function valider() {

      const participant =
        document.getElementById("participant")
        .options[
          document.getElementById("participant").selectedIndex
        ].text;

      alert(
        participant +
        " : " +
        nombre +
        " montée(s) sélectionnée(s)."
      );

    }

  </script>

</body>
</html>
